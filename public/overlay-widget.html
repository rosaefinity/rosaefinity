<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RosaeFinity Overlay Widget</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body { pointer-events: none; }

    #alerts-container {
      position: fixed;
      bottom: 20px; left: 20px; right: 20px;
      display: flex;
      flex-direction: column-reverse;
      gap: 10px;
      z-index: 9999;
    }

    .alert-card {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 18px; border-radius: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                 fadeOut 0.4s ease forwards var(--out-delay, 4.5s);
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
    }

    .alert-gift    { background: rgba(224, 48, 106, 0.88); color: #fff; }
    .alert-follow  { background: rgba(78, 123, 255, 0.88); color: #fff; }
    .alert-comment { background: rgba(30, 30, 50, 0.82); color: #e8e8ff; border: 1px solid rgba(255,255,255,0.1); }
    .alert-like    { background: rgba(240, 160, 32, 0.88); color: #fff; }
    .alert-share   { background: rgba(62, 207, 142, 0.88); color: #fff; }
    .alert-subscribe { background: rgba(168, 85, 247, 0.88); color: #fff; }
    .alert-action  { background: rgba(124, 58, 237, 0.88); color: #fff; }

    .alert-icon { font-size: 28px; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    .alert-body { flex: 1; min-width: 0; }
    .alert-title { font-size: 11px; font-weight: 700; text-transform: uppercase; opacity: 0.7; letter-spacing: 0.06em; margin-bottom: 2px; }
    .alert-user { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alert-detail { font-size: 12px; opacity: 0.8; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alert-badge { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 4px 12px; font-size: 14px; font-weight: 700; flex-shrink: 0; }

    /* ── Fullscreen media overlays (video/image) ── */
    .media-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    .media-overlay video,
    .media-overlay img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes slideIn {
      from { transform: translateX(-40px); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    #no-events {
      position: fixed;
      bottom: 20px; left: 20px;
      color: rgba(255,255,255,0.15);
      font-size: 11px;
      font-family: 'Segoe UI', sans-serif;
      letter-spacing: 0.05em;
    }
    #status-dot {
      position: fixed;
      top: 8px; right: 8px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
      z-index: 99999;
    }
    #status-dot.connected { background: #22c55e; }

    /* ── Diagnostic Panel ── */
    #diagnostic-panel {
      position: fixed;
      top: 10px; left: 10px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 11px;
      line-height: 1.6;
      z-index: 99999;
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: auto;
      min-width: 280px;
    }
    #diagnostic-panel .diag-line { margin: 2px 0; }
    #diagnostic-panel .diag-label { color: #aaa; }
    #diagnostic-panel .diag-value { color: #fff; }
    #diagnostic-panel .diag-value.connected { color: #22c55e; }
    #diagnostic-panel .diag-value.disconnected { color: #ef4444; }
    #diagnostic-panel .diag-value.success { color: #22c55e; }
    #diagnostic-panel .diag-value.error { color: #ef4444; }
  </style>
</head>
<body>
  <!-- Debug/Development elements (only visible when ?debug=1) -->
  <div id="status-dot" title="Disconnected" hidden></div>
  <div id="no-events" hidden>🌹 RosaeFinity Overlay — waiting for events...</div>
  <div id="alerts-container"></div>

  <!-- Diagnostic Panel (only visible when ?debug=1) -->
  <div id="diagnostic-panel" hidden>
    <div class="diag-line"><span class="diag-label">Overlay Widget: </span><span class="diag-value" id="diag-widget">Connected</span></div>
    <div class="diag-line"><span class="diag-label">Screen: </span><span class="diag-value" id="diag-screen">-</span></div>
    <div class="diag-line"><span class="diag-label">SSE: </span><span class="diag-value disconnected" id="diag-sse">DISCONNECTED</span></div>
    <div class="diag-line"><span class="diag-label">Last Event: </span><span class="diag-value" id="diag-last-event">none</span></div>
    <div class="diag-line"><span class="diag-label">Last Render: </span><span class="diag-value" id="diag-last-render">-</span></div>
  </div>

  <script>
    const container = document.getElementById("alerts-container");
    const noEvents = document.getElementById("no-events");
    const statusDot = document.getElementById("status-dot");
    const diagnosticPanel = document.getElementById("diagnostic-panel");
    const ICONS = { gift: "🎁", follow: "👤", comment: "💬", like: "❤️", share: "🔗", subscribe: "⭐", action: "⚡", keystroke: "⌨️" };

    // Track active audio instances to prevent garbage collection
    const activeAudioInstances = new Set();

    // Unique runtime instance identity for this overlay-widget.html load
    const overlayInstanceId =
      'overlay-' +
      Date.now() +
      '-' +
      Math.random().toString(36).slice(2, 9);

    // widgetUrl must be defined before overlayScreenKey uses it
    const widgetUrl = new URL(window.location.href);

    // Normalized screen key from URL parameter
    const overlayScreenKey = normalizeScreen(
      widgetUrl.searchParams.get('screen') || ''
    );

    // Per-screen maximum queue length (from URL parameter, fallback to 5)
    const maxQueueParam = widgetUrl.searchParams.get('maxQueue');
    const DEFAULT_MAX_QUEUE_LENGTH = 5;
    const overlayMaxQueueLength = (maxQueueParam !== null && !isNaN(parseInt(maxQueueParam)))
      ? Math.max(1, parseInt(maxQueueParam))
      : DEFAULT_MAX_QUEUE_LENGTH;

    // Track active video per screen — only ONE video per screen at a time.
    // When a new video arrives for the same screen, it is queued FIFO.
    const activeVideoByScreen = {};

    // Per-screen FIFO video queue
    // Only ONE video plays at a time per screen. Additional videos are queued FIFO.
    const videoQueueByScreen = {};
    // Per-screen max queue lengths - will be populated from URL or defaults
    const maxVideoQueueLengthByScreen = {};
    // Initialize current screen with configured max
    maxVideoQueueLengthByScreen[overlayScreenKey] = overlayMaxQueueLength;

    // Instance initialization diagnostic
    console.log('[OVERLAY-INSTANCE]', {
      instanceId: overlayInstanceId,
      screenKey: overlayScreenKey,
      href: window.location.href,
      timestamp: Date.now(),
    });

    // Play the next video in the queue for a given screen
    async function playNextInQueue(screenKey) {
      const normalizedKey = normalizeScreen(screenKey);
      const queue = videoQueueByScreen[normalizedKey];
      if (!queue || queue.length === 0) {
        console.log('[TIMING-TRACE]', JSON.stringify({
          stage: 'playNextInQueue-empty',
          screenKey: normalizedKey,
          timestamp: Date.now(),
        }));
        // Clear any stale active video reference
        if (activeVideoByScreen[normalizedKey]) {
          delete activeVideoByScreen[normalizedKey];
        }
        return;
      }

      // If there's already an active video for this screen, don't start another
      if (activeVideoByScreen[normalizedKey]) {
        console.log('[TIMING-TRACE]', JSON.stringify({
          stage: 'playNextInQueue-wait',
          screenKey: normalizedKey,
          activeActionExecutionId: activeVideoByScreen[normalizedKey].actionExecutionId,
          queueLength: queue.length,
          timestamp: Date.now(),
        }));
        return;
      }

      const entry = queue[0];
      if (entry.started) {
        console.log('[TIMING-TRACE]', JSON.stringify({
          stage: 'playNextInQueue-skip-started',
          screenKey: normalizedKey,
          actionExecutionId: entry.actionExecutionId,
          timestamp: Date.now(),
        }));
        return;
      }

      entry.started = true;
      console.log('[TIMING-TRACE]', JSON.stringify({
        stage: 'playNextInQueue-start',
        screenKey: normalizedKey,
        actionExecutionId: entry.actionExecutionId,
        queueLength: queue.length,
        timestamp: Date.now(),
      }));

      await playQueuedVideo(normalizedKey, entry);
    }

    // Create and play a queued video - SINGLE video playback implementation
    async function playQueuedVideo(screenKey, entry) {
      const data = entry.data;
      const actionExecutionId = entry.actionExecutionId;
      const removalState = entry.removalState; // Use the SAME removalState object throughout lifecycle
      const videoScreenKey = normalizeScreen(data.screen || data.screenId || '');

      // FIX 1+2: prefer lightweight local media URL; fall back to legacy base64/videoFile
      const mediaSrc = data.mediaUrl || data.videoFile;
      const mediaSrcIsLocalHttp = typeof mediaSrc === 'string' && mediaSrc.indexOf('http://127.0.0.1:18890/media/') === 0;
      const videoSrcAssignMs = Date.now();

      console.log('[TIMING-TRACE]', JSON.stringify({
        stage: 'playQueuedVideo-entry',
        actionExecutionId,
        actionId: data.actionId,
        screenKey: videoScreenKey,
        hasMediaUrl: !!data.mediaUrl,
        videoFileIsLocalHttp: typeof data.videoFile === 'string' && data.videoFile.indexOf('http://127.0.0.1:18890/media/') === 0,
        videoFileIsBase64: typeof data.videoFile === 'string' && data.videoFile.indexOf('data:') === 0,
        mediaSrcPrefix: typeof mediaSrc === 'string' ? mediaSrc.substring(0, 80) : null,
        mediaSrcIsLocalHttp,
        timestamp: Date.now(),
      }));

      console.log('[TIMING-TRACE]', JSON.stringify({
        stage: 'playQueuedVideo-playing',
        actionExecutionId,
        screenKey: videoScreenKey,
        timestamp: Date.now(),
      }));

      // Create overlay element
      const overlay = document.createElement("div");
      overlay.className = "media-overlay";

      // Create video element (use preload cache if available)
      const preloaded = consumePreload(mediaSrc);
      const vid = preloaded || document.createElement("video");
      if (!preloaded) {
        // Local HTTP URL loads via range requests — no base64 decode required.
        // preload=auto lets the browser start fetching immediately.
        vid.preload = 'auto';
        vid.src = mediaSrc || '';
        vid.autoplay = true;
        vid.playsInline = true;
        vid.setAttribute("playsinline", "");
        vid.volume = 1;
        vid.muted = false;
      } else {
        vid.autoplay = true;
        vid.playsInline = true;
        vid.volume = 1;
        vid.muted = false;
      }

      console.log('[VIDEO-MEDIA-TIMING]', 'video-src-assigned', JSON.stringify({
        actionExecutionId,
        actionId: data.actionId,
        screenKey: videoScreenKey,
        srcAssignMs: Date.now() - videoSrcAssignMs,
        isLocalHttp: mediaSrcIsLocalHttp,
        readyState: vid.readyState,
        networkState: vid.networkState,
        timestamp: Date.now(),
      }));

      overlay.appendChild(vid);
      document.body.appendChild(overlay);

      // Update queue entry with DOM references
      entry.overlay = overlay;
      entry.vid = vid;
      // Do NOT create a new removalState - use the one from the queue entry

      // Update activeVideoByScreen to track this video (identity-safe reference)
      activeVideoByScreen[videoScreenKey] = {
        overlay,
        vid,
        removalState: removalState, // Same object reference for identity checks
        actionName: data.actionName,
        pending: true,
        actionExecutionId: actionExecutionId
      };

      console.log('[VIDEO-QUEUE]', {
        phase: 'started',
        instanceId: overlayInstanceId,
        screenKey: videoScreenKey,
        actionExecutionId: actionExecutionId,
        timestamp: Date.now(),
      });

      // Duration-based removal — Action duration is visibility lifetime for video
      const dur = (data.duration || 5) * 1000;
      const videoStartMs = Date.now();
      console.log('[ACTION-DURATION-TIMER]', JSON.stringify({
        actionId: data.actionId,
        effectType: 'video',
        durationMs: dur,
        actionExecutionId: actionExecutionId,
      }));
      console.log('[ACTION-EFFECT-START]', JSON.stringify({
        actionId: data.actionId,
        effectType: 'video',
        duration: data.duration || 5,
        actionExecutionId: actionExecutionId,
      }));

      // Single idempotent completion/removal function for this queue entry
      const complete = () => {
        // Guard against duplicate completion
        if (removalState.removed) {
          console.log('[VIDEO-QUEUE]', {
            phase: 'stale-callback',
            instanceId: overlayInstanceId,
            screenKey: videoScreenKey,
            actionExecutionId: actionExecutionId,
            reason: 'already completed',
            timestamp: Date.now(),
          });
          return;
        }
        removalState.removed = true;
        entry.completed = true;

        // Pause video and clear source
        try { vid.pause(); } catch { /* already stopped */ }
        vid.src = '';

        console.log('[TIMING-TRACE]', JSON.stringify({
          stage: 'playQueuedVideo-complete',
          actionExecutionId,
          actionId: data.actionId,
          elapsedMs: Date.now() - videoStartMs,
          expectedDurationMs: dur,
          timestamp: Date.now(),
        }));

        console.log('[ACTION-EFFECT-END]', JSON.stringify({
          actionId: data.actionId,
          effectType: 'video',
          elapsedMs: Date.now() - videoStartMs,
          expectedDurationMs: dur,
          actionExecutionId: actionExecutionId,
        }));

        // Relay completion across Browser Source → Electron renderer context.
        if (actionExecutionId) {
          const completion = {
            type: 'media-complete',
            mediaType: 'video',
            screen: videoScreenKey,
            actionExecutionId,
            actionId: data.actionId,
            actionName: data.actionName,
            timestamp: Date.now(),
          };
          fetch('http://127.0.0.1:18890/event', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(completion),
          }).then((response) => {
            console.log('[MEDIA-COMPLETE-RELAY][HTTP]', JSON.stringify({
              actionExecutionId,
              screen: videoScreenKey,
              mediaType: 'video',
              status: response.status,
              ok: response.ok,
              timestamp: Date.now(),
            }));
          }).catch((error) => {
            console.error('[MEDIA-COMPLETE-RELAY][HTTP-ERROR]', JSON.stringify({
              actionExecutionId,
              screen: videoScreenKey,
              mediaType: 'video',
              error: error instanceof Error ? error.message : String(error),
              timestamp: Date.now(),
            }));
          });
        }

        // Dispatch existing media-complete behavior
        if (actionExecutionId) {
          console.log('[TIMING-TRACE]', JSON.stringify({
            stage: 'playQueuedVideo-media-complete-dispatch',
            actionExecutionId,
            actionId: data.actionId,
            actionName: data.actionName,
            screen: videoScreenKey,
            mediaType: 'video',
            timestamp: Date.now(),
          }));
          window.dispatchEvent(new CustomEvent('rosae:media-complete', {
            detail: {
              type: 'media-complete',
              mediaType: 'video',
              screen: videoScreenKey,
              actionExecutionId: actionExecutionId,
              actionId: data.actionId,
              actionName: data.actionName,
              timestamp: Date.now(),
            }
          }));
        }

        // Remove overlay DOM
        if (overlay.parentElement) overlay.remove();

        // Identity-safe: remove activeVideoByScreen ONLY if it still references THIS entry
        if (activeVideoByScreen[videoScreenKey]?.removalState === removalState) {
          delete activeVideoByScreen[videoScreenKey];
        }

        // Identity-safe: remove queue[0] ONLY if it is THIS exact queue entry
        const queue = videoQueueByScreen[videoScreenKey];
        if (queue && queue[0] === entry) {
          queue.shift();
        } else {
          console.log('[VIDEO-QUEUE]', {
            phase: 'stale-callback',
            instanceId: overlayInstanceId,
            screenKey: videoScreenKey,
            actionExecutionId: actionExecutionId,
            reason: 'queue head changed',
            queueLength: queue?.length,
            timestamp: Date.now(),
          });
        }

        // Preload next queued video immediately to minimize gap
        preloadNextVideo();

        // Advance queue - play next video
        console.log('[TIMING-TRACE]', JSON.stringify({
          stage: 'playQueuedVideo-next-queue',
          actionExecutionId,
          remainingQueueLength: queue?.length || 0,
          timestamp: Date.now(),
        }));
        playNextInQueue(videoScreenKey);
      };

      // Both duration timeout AND natural video end trigger completion
      // Guard flag in complete() prevents double-fire
      setTimeout(complete, dur);
      vid.onended = complete;

      // Video metadata loaded
      vid.onloadedmetadata = () => {
        console.log('[TIMING-TRACE]', JSON.stringify({
          stage: 'video-loadedmetadata',
          actionExecutionId,
          actionName: data.actionName,
          videoWidth: vid.videoWidth,
          videoHeight: vid.videoHeight,
          readyState: vid.readyState,
          duration: vid.duration,
          timestamp: Date.now(),
        }));
      };

      // Video ready to play
      vid.oncanplay = () => {
        console.log('[TIMING-TRACE]', JSON.stringify({
          stage: 'video-oncanplay',
          actionExecutionId,
          readyState: vid.readyState,
          timestamp: Date.now(),
        }));
        // Only proceed if this video is still the active one for this screen
        if (removalState.removed) return;
        if (activeVideoByScreen[videoScreenKey]?.removalState !== removalState) {
          console.log('[VIDEO-QUEUE] stale-video-cancelled', JSON.stringify({
            screen: videoScreenKey,
            actionExecutionId: actionExecutionId,
            timestamp: Date.now(),
          }));
          return;
        }
        attemptPlay();
      };

      vid.onplaying = () => {
        console.log('[TIMING-TRACE]', JSON.stringify({
          stage: 'video-onplaying',
          actionExecutionId,
          actionName: data.actionName,
          readyState: vid.readyState,
          timestamp: Date.now(),
        }));
      };

      vid.onerror = (e) => {
        console.error('[VIDEO-QUEUE] ERROR', JSON.stringify({
          actionName: data.actionName,
          error: vid.error ? {
            code: vid.error.code,
            message: vid.error.message
          } : 'Unknown video error',
          readyState: vid.readyState,
          networkState: vid.networkState,
          timestamp: Date.now(),
        }));
        console.log('[VIDEO-QUEUE] ERROR', JSON.stringify({
          type: 'video',
          actionName: data.actionName,
          error: vid.error ? vid.error.message : 'Unknown video error',
          timestamp: Date.now(),
        }));
        updateDiag('diag-last-render', 'ERROR', 'error');
        // On error, still complete to advance queue
        complete();
      };

      // ── Autoplay Policy Handler ──
      let audioUnlocked = false;

      function unlockOverlayAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;
        console.log('[OVERLAY-WIDGET-AUTOPLAY] audio unlocked by user interaction', {
          timestamp: Date.now(),
        });
      }

      // Register user interaction listeners for audio unlock
      ['click', 'pointerdown', 'keydown'].forEach(evt => {
        document.addEventListener(evt, unlockOverlayAudio, { once: true, passive: true });
      });

      async function attemptPlay() {
        // Stale check: this video has been replaced or removed
        if (removalState.removed) {
          console.log('[VIDEO-QUEUE] stale-video-cancelled', JSON.stringify({
            screen: videoScreenKey,
            actionExecutionId: actionExecutionId,
            timestamp: Date.now(),
          }));
          return false;
        }
        // Identity check: ensure this video is still the registered one for this screen
        if (activeVideoByScreen[videoScreenKey]?.removalState !== removalState) {
          console.log('[VIDEO-QUEUE] stale-video-cancelled', JSON.stringify({
            screen: videoScreenKey,
            actionExecutionId: actionExecutionId,
            timestamp: Date.now(),
          }));
          return false;
        }
        // First attempt: normal playback with audio
        console.log('[TIMING-TRACE]', JSON.stringify({
          stage: 'attemptPlay-normal-attempt',
          actionExecutionId,
          actionName: data.actionName,
          videoSrc: vid.src ? vid.src.substring(0, 100) : null,
          muted: vid.muted,
          readyState: vid.readyState,
          timestamp: Date.now(),
        }));

        try {
          await vid.play();
          console.log('[TIMING-TRACE]', JSON.stringify({
            stage: 'attemptPlay-normal-success',
            actionExecutionId,
            actionName: data.actionName,
            readyState: vid.readyState,
            timestamp: Date.now(),
          }));
          console.log('[VIDEO-MEDIA-TIMING]', 'playback-started', JSON.stringify({
            actionExecutionId,
            actionId: data.actionId,
            playbackStartMs: Date.now() - videoSrcAssignMs,
            readyState: vid.readyState,
            currentTime: vid.currentTime,
            timestamp: Date.now(),
          }));
          console.log('[VIDEO-QUEUE] COMPLETE', JSON.stringify({
            type: 'video',
            actionName: data.actionName,
            timestamp: Date.now(),
          }));
          updateDiag('diag-last-render', 'SUCCESS', 'success');
          return true;
        } catch (err) {
          // Check if it's an autoplay policy error
          const isAutoplayError = err.name === 'NotAllowedError' ||
                                  err.message?.includes('autoplay') ||
                                  err.message?.includes('user didn\'t interact') ||
                                  err.message?.includes('user interaction');

          if (isAutoplayError) {
            console.log('[OVERLAY-WIDGET-AUTOPLAY] normal play blocked', JSON.stringify({
              actionName: data.actionName,
              error: err.message,
              readyState: vid.readyState,
              timestamp: Date.now(),
            }));

            // Second attempt: muted autoplay fallback
            console.log('[OVERLAY-WIDGET-AUTOPLAY] retrying muted autoplay', JSON.stringify({
              actionName: data.actionName,
              videoSrc: vid.src ? vid.src.substring(0, 100) : null,
              muted: true,
              readyState: vid.readyState,
              timestamp: Date.now(),
            }));

            vid.muted = true;

            try {
              await vid.play();
              console.log('[OVERLAY-WIDGET-AUTOPLAY] muted autoplay success', JSON.stringify({
                actionName: data.actionName,
                readyState: vid.readyState,
                timestamp: Date.now(),
              }));
              console.log('[VIDEO-MEDIA-TIMING]', 'playback-started-muted', JSON.stringify({
                actionExecutionId,
                actionId: data.actionId,
                playbackStartMs: Date.now() - videoSrcAssignMs,
                readyState: vid.readyState,
                timestamp: Date.now(),
              }));
              console.log('[VIDEO-QUEUE] COMPLETE', JSON.stringify({
                type: 'video',
                actionName: data.actionName,
                mutedAutoplay: true,
                timestamp: Date.now(),
              }));
              updateDiag('diag-last-render', 'SUCCESS_MUTED_AUTOPLAY', 'success');
              return true;
            } catch (err2) {
              console.log('[OVERLAY-WIDGET-AUTOPLAY] muted autoplay failed', JSON.stringify({
                actionName: data.actionName,
                error: err2.message,
                readyState: vid.readyState,
                timestamp: Date.now(),
              }));
              console.log('[VIDEO-QUEUE] ERROR', JSON.stringify({
                type: 'video',
                actionName: data.actionName,
                error: err2.message,
                timestamp: Date.now(),
              }));
              updateDiag('diag-last-render', 'ERROR', 'error');
              return false;
            }
          } else {
            // Other error (network, decode, etc.)
            console.error('[VIDEO-QUEUE] play failed', JSON.stringify({
              actionName: data.actionName,
              error: err.message,
              timestamp: Date.now(),
            }));
            console.log('[VIDEO-QUEUE] ERROR', JSON.stringify({
              type: 'video',
              actionName: data.actionName,
              error: err.message,
              timestamp: Date.now(),
            }));
            updateDiag('diag-last-render', 'ERROR', 'error');
            return false;
          }
        }
      }

      // FIX 1+2: Local HTTP media can start play as soon as HAVE_CURRENT_DATA (2).
      // Legacy base64 data URLs still typically need canplay (HAVE_FUTURE_DATA).
      // Keep autoplay policy fallback (muted retry) unchanged.
      if (vid.readyState >= 2) { // HAVE_CURRENT_DATA — safe to attempt play earlier
        attemptPlay();
      } else {
        let playAttempted = false;
        const tryPlayOnce = () => {
          if (playAttempted) return;
          playAttempted = true;
          if (removalState.removed) return;
          if (activeVideoByScreen[videoScreenKey]?.removalState !== removalState) {
            console.log('[VIDEO-QUEUE] stale-video-cancelled', JSON.stringify({
              screen: videoScreenKey,
              actionExecutionId: actionExecutionId,
              timestamp: Date.now(),
            }));
            return;
          }
          attemptPlay();
        };
        // Prefer loadeddata (earlier) then canplay for compatibility
        vid.onloadeddata = tryPlayOnce;
        vid.oncanplay = tryPlayOnce;
      }
    }

    // ── VIDEO PRELOAD CACHE ──// ── VIDEO PRELOAD CACHE ──
    // Preloads the next queued video in background to eliminate gap between videos.
    let _preloadVideo = null;
    let _preloadSrc = null;

    // ── DEBUG MODE DETECTION ──
    const debugMode = widgetUrl.searchParams.get('debug') === '1';
    if (debugMode) {
      // Show debug elements
      statusDot.hidden = false;
      noEvents.hidden = false;
      diagnosticPanel.hidden = false;
    }

    // ── OVERLAY-WIDGET-BUILD ──
    const OVERLAY_WIDGET_BUILD_ID = 'SSE-FIX-' + Date.now();
    console.log('[OVERLAY-WIDGET-BUILD]', JSON.stringify({
      buildId: OVERLAY_WIDGET_BUILD_ID,
      href: window.location.href,
      debugMode,
      timestamp: Date.now(),
    }));

    // ── OVERLAY-WIDGET-RUNTIME-LOCATION ──
    console.log('[OVERLAY-WIDGET-RUNTIME-LOCATION]', JSON.stringify({
      href: window.location.href,
      origin: window.location.origin,
      pathname: window.location.pathname,
      search: window.location.search,
      hash: window.location.hash,
      rawScreen: widgetUrl.searchParams.get('screen'),
      debugParam: widgetUrl.searchParams.get('debug'),
      timestamp: Date.now(),
    }));

    // ── CANONICAL SCREEN PARSING ──
    const rawScreen = widgetUrl.searchParams.get('screen');
    const screen = rawScreen ? String(rawScreen).trim() : '';

    console.log('[OVERLAY-WIDGET-SCREEN-PARSE]', JSON.stringify({
      href: widgetUrl.href,
      rawScreen,
      screen,
      search: widgetUrl.search,
      timestamp: Date.now(),
    }));

    // Runtime assertion
    if (widgetUrl.searchParams.has('screen') && !screen) {
      console.error('[OVERLAY-WIDGET-SCREEN-BUG]', JSON.stringify({
        message: 'URL contains screen parameter but canonical screen is empty',
        href: window.location.href,
        search: window.location.search,
        timestamp: Date.now(),
      }));
    }

    const filterScreen = screen;

    // ── Diagnostic panel helpers ──
    function updateDiag(id, value, className) {
      const el = document.getElementById(id);
      if (el) {
        el.textContent = value;
        el.className = 'diag-value' + (className ? ' ' + className : '');
      }
    }

    // Shared normalizeScreen function (must match server)
    function normalizeScreen(screen) {
      if (!screen) return '';
      return String(screen).trim().toLowerCase().replace(/^screen[-\s]?/i, '');
    }

    // ── OVERLAY-WIDGET-BOOT ──
    const normalizedWidgetScreen = normalizeScreen(screen);
    const sseUrl = `http://127.0.0.1:18890/events?screen=${encodeURIComponent(screen || '')}`;
    console.log('[OVERLAY-WIDGET-BOOT]', JSON.stringify({
      href: window.location.href,
      origin: window.location.origin,
      pathname: window.location.pathname,
      search: window.location.search,
      screenParam: screen,
      normalizedScreen: normalizedWidgetScreen,
      sseUrl: sseUrl,
      debugMode,
      timestamp: Date.now(),
    }));
    updateDiag('diag-screen', screen || '(all)');
    updateDiag('diag-widget', 'Connected');

    // ── VIDEO PRELOAD HELPERS ──
    // Preloads the next queued video so it starts instantly when current ends.
    function preloadNextVideo() {
      try {
        const ev = window.__rf_peekNextQueued?.();
        const preloadSrc = ev && (ev.mediaUrl || ev.videoFile);
        if (!ev || ev.type !== 'video' || !preloadSrc) { cleanupPreload(); return; }
        if (preloadSrc === _preloadSrc && _preloadVideo?.readyState >= 2) return; // already ready
        if (preloadSrc === _preloadSrc) return; // already loading
        cleanupPreload();
        _preloadSrc = preloadSrc;
        _preloadVideo = document.createElement('video');
        _preloadVideo.preload = 'auto';
        _preloadVideo.muted = true;
        _preloadVideo.src = preloadSrc;
        _preloadVideo.load();
        console.log('[PRELOAD] started', JSON.stringify({ src: String(preloadSrc).substring(0, 80), ts: Date.now() }));
      } catch { cleanupPreload(); }
    }

    function consumePreload(src) {
      if (_preloadVideo && _preloadSrc === src && _preloadVideo.readyState >= 2) {
        const el = _preloadVideo;
        console.log('[PRELOAD] consumed', JSON.stringify({ src: String(src || '').substring(0, 80), readyState: el.readyState, ts: Date.now() }));
        _preloadVideo = null; _preloadSrc = null;
        el.preload = 'auto'; el.muted = false; el.loop = false;
        el.currentTime = 0;
        return el;
      }
      cleanupPreload();
      return null;
    }

    function cleanupPreload() {
      if (_preloadVideo) {
        try { _preloadVideo.removeAttribute('src'); _preloadVideo.load(); } catch {}
        _preloadVideo = null; _preloadSrc = null;
      }
    }

    function buildOverlayDedupKey(actionExecutionId, type) {
      // Multi-transport can deliver the SAME event multiple times (SSE +
      // CustomEvent + localStorage + BroadcastChannel). Different effect types
      // under one actionExecutionId (sound + video + image) are DIFFERENT
      // deliveries and must all run — key includes type.
      if (!actionExecutionId) return null;
      return actionExecutionId + '::' + (type || 'unknown');
    }

    function showAlert(data) {
      if (!data) return;
      if (data.type === 'media-complete' || data.eventType === 'media-complete') return;
      if (filterScreen && !(data.screen || data.screenId)) return;

      // Deduplicate per (actionExecutionId, type) so combined effects under one
      // execution id all run, while multi-transport duplicates of the same
      // effect type are ignored.
      const dedupKey = buildOverlayDedupKey(data.actionExecutionId, data.type);
      if (dedupKey) {
        if (!window.__overlayDedup) {
          window.__overlayDedup = new Map();
        }
        const existing = window.__overlayDedup.get(dedupKey);
        if (existing) {
          console.log('[OVERLAY-WIDGET] DUPLICATE DELIVERY IGNORED', {
            dedupKey,
            actionExecutionId: data.actionExecutionId,
            screen: data.screen,
            type: data.type,
            timestamp: Date.now(),
          });
          return;
        }
        window.__overlayDedup.set(dedupKey, Date.now());

        // Bounded cleanup: keep at most 200 entries, remove oldest
        if (window.__overlayDedup.size > 200) {
          const oldestKey = window.__overlayDedup.keys().next().value;
          if (oldestKey !== undefined) {
            window.__overlayDedup.delete(oldestKey);
          }
        }
      }

      noEvents.style.display = "none";

      // ── SOUND (audio playback for TikTok LIVE Studio Browser Source) ──
      if (data.type === "sound" && data.soundFile) {
        const soundStartMs = Date.now();
        const expectedDurationMs = ((data.duration || 5) * 1000);
        console.log('[OVERLAY-WIDGET-RENDER] START', JSON.stringify({
          type: 'sound',
          actionName: data.actionName,
          actionId: data.actionId,
          screen: data.screen,
          soundFile: data.soundFile ? data.soundFile.substring(0, 100) : null,
          soundFileLength: data.soundFile ? data.soundFile.length : 0,
          soundVolume: data.soundVolume,
          soundFadeIn: data.soundFadeIn,
          soundFadeOut: data.soundFadeOut,
          soundLoop: data.soundLoop,
          duration: data.duration,
          timestamp: Date.now(),
        }));
        console.log('[ACTION-EFFECT-START]', JSON.stringify({
          actionId: data.actionId,
          effectType: 'sound',
          duration: data.duration || 5,
          actionExecutionId: data.actionExecutionId,
        }));

        try {
          const audio = new Audio(data.soundFile);

          // Apply volume safely (clamp between 0 and 1)
          const volume = Math.max(0, Math.min(1, data.soundVolume ?? 0.8));
          audio.volume = volume;

          // Fade in
          if (data.soundFadeIn && data.soundFadeIn > 0) {
            audio.volume = 0;
            const fadeSteps = 20;
            const stepTime = (data.soundFadeIn * 1000) / fadeSteps;
            let step = 0;
            const fadeInterval = setInterval(() => {
              step++;
              audio.volume = Math.min(volume, (step / fadeSteps) * volume);
              if (step >= fadeSteps) clearInterval(fadeInterval);
            }, stepTime);
          }

          // Fade out
          if (data.soundFadeOut && data.soundFadeOut > 0) {
            audio.addEventListener("timeupdate", () => {
              const remaining = audio.duration - audio.currentTime;
              const fadeOut = data.soundFadeOut;
              if (remaining <= fadeOut && remaining > 0) {
                audio.volume = Math.max(0, (remaining / fadeOut) * volume);
              }
            });
          }

          audio.loop = data.soundLoop || false;

          // Track audio instance to prevent premature garbage collection
          activeAudioInstances.add(audio);

          // Trace audio playback
          audio.onplay = () => {
            console.log('[OVERLAY-WIDGET-RENDER] SOUND playing', JSON.stringify({
              actionName: data.actionName,
              soundFile: data.soundFile ? data.soundFile.substring(0, 100) : null,
              duration: audio.duration,
              volume: audio.volume,
              loop: audio.loop,
              timestamp: Date.now(),
            }));
            console.log('[OVERLAY-WIDGET-RENDER] COMPLETE', JSON.stringify({
              type: 'sound',
              actionName: data.actionName,
              timestamp: Date.now(),
            }));
            updateDiag('diag-last-render', 'SUCCESS', 'success');
          };

          audio.onerror = (e) => {
            const audioError = audio.error ? audio.error.message : 'Unknown audio error';
            console.error('[OVERLAY-WIDGET-RENDER] SOUND ERROR', JSON.stringify({
              actionName: data.actionName,
              error: audioError,
              timestamp: Date.now(),
            }));
            console.log('[OVERLAY-WIDGET-RENDER] ERROR', JSON.stringify({
              type: 'sound',
              actionName: data.actionName,
              error: audioError,
              timestamp: Date.now(),
            }));
            updateDiag('diag-last-render', 'ERROR', 'error');
            // Signal completion on failure so the action queue can advance.
            setTimeout(() => completeSound(), 0);
            // Remove from tracking
            activeAudioInstances.delete(audio);
          };

          // Guard against double-completion (onended vs duration fallback)
          let soundCompleted = false;
          let soundDurationTimer = null;
          const completeSound = () => {
            if (soundCompleted) return;
            soundCompleted = true;
            // Clear duration timer if it exists (audio ended naturally before timeout)
            if (soundDurationTimer) {
              clearTimeout(soundDurationTimer);
              soundDurationTimer = null;
            }
            console.log('[OVERLAY-WIDGET-RENDER] SOUND ended', JSON.stringify({
              actionName: data.actionName,
              timestamp: Date.now(),
            }));
            console.log('[ACTION-EFFECT-END]', JSON.stringify({
              actionId: data.actionId,
              effectType: 'sound',
              elapsedMs: Date.now() - soundStartMs,
              expectedDurationMs,
              actionExecutionId: data.actionExecutionId,
            }));
            // Remove from tracking
            activeAudioInstances.delete(audio);
            // Relay completion across Browser Source → Electron renderer context.
            if (data.actionExecutionId) {
              const completion = {
                type: 'media-complete',
                mediaType: 'sound',
                screen: data.screen,
                actionExecutionId: data.actionExecutionId,
                actionId: data.actionId,
                actionName: data.actionName,
                timestamp: Date.now(),
              };
              fetch('http://127.0.0.1:18890/event', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(completion),
              }).then((response) => {
                console.log('[MEDIA-COMPLETE-RELAY][HTTP]', JSON.stringify({
                  actionExecutionId: data.actionExecutionId,
                  screen: data.screen,
                  mediaType: 'sound',
                  status: response.status,
                  ok: response.ok,
                  timestamp: Date.now(),
                }));
              }).catch((error) => {
                console.error('[MEDIA-COMPLETE-RELAY][HTTP-ERROR]', JSON.stringify({
                  actionExecutionId: data.actionExecutionId,
                  screen: data.screen,
                  mediaType: 'sound',
                  error: error instanceof Error ? error.message : String(error),
                  timestamp: Date.now(),
                }));
              });
            }
            // Notify action queue of SOUND completion (media-aware)
            if (data.actionExecutionId) {
              console.log('[OVERLAY-WIDGET-COMPLETION] sound complete', JSON.stringify({
                actionExecutionId: data.actionExecutionId,
                actionId: data.actionId,
                actionName: data.actionName,
                screen: data.screen,
                mediaType: 'sound',
                timestamp: Date.now(),
              }));
              window.dispatchEvent(new CustomEvent('rosae:media-complete', {
                detail: {
                  type: 'media-complete',
                  mediaType: 'sound',
                  screen: data.screen,
                  actionExecutionId: data.actionExecutionId,
                  actionId: data.actionId,
                  actionName: data.actionName,
                  timestamp: Date.now(),
                }
              }));
            }
          };

          audio.onended = completeSound;

          // Duration-based stop: ensures playback stops after configured Action duration.
          // For looping sounds: `ended` never fires, so this is the only completion trigger.
          // For non-looping sounds shorter than duration: onended fires first, timer is cleared.
          // For non-looping sounds longer than duration: timer fires first, stops audio.
          if (data.duration) {
            const durMs = (data.duration || 5) * 1000;
            console.log('[ACTION-DURATION-TIMER]', JSON.stringify({
              actionId: data.actionId,
              effectType: 'sound',
              durationMs: durMs,
              actionExecutionId: data.actionExecutionId,
            }));
            soundDurationTimer = setTimeout(() => {
              if (soundCompleted) return;
              // Stop actual audio playback before completing
              try { audio.pause(); } catch { /* already stopped */ }
              audio.src = '';
              completeSound();
            }, durMs);
          }

          audio.play().catch((err) => {
            console.error('[OVERLAY-WIDGET-RENDER] SOUND play failed', JSON.stringify({
              actionName: data.actionName,
              error: err.message,
              timestamp: Date.now(),
            }));
            console.log('[OVERLAY-WIDGET-RENDER] ERROR', JSON.stringify({
              type: 'sound',
              actionName: data.actionName,
              error: err.message,
              timestamp: Date.now(),
            }));
            updateDiag('diag-last-render', 'ERROR', 'error');
            completeSound();
            activeAudioInstances.delete(audio);
          });

        } catch (err) {
          console.error('[OVERLAY-WIDGET-RENDER] SOUND ERROR', JSON.stringify({
            actionName: data.actionName,
            error: err instanceof Error ? err.message : String(err),
            timestamp: Date.now(),
          }));
          console.log('[OVERLAY-WIDGT-RENDER] ERROR', JSON.stringify({
            type: 'sound',
            actionName: data.actionName,
            error: err instanceof Error ? err.message : String(err),
            timestamp: Date.now(),
          }));
          updateDiag('diag-last-render', 'ERROR', 'error');
        }
        return;
      }

      // ── VIDEO (fullscreen, full resolution) ──
      if (data.type === "video" && data.videoFile) {
        console.log('[OVERLAY-WIDGET-RENDER] START', JSON.stringify({
          type: 'video',
          actionName: data.actionName,
          screen: data.screen,
          videoFile: data.videoFile.substring(0, 100),
          videoFileLength: data.videoFile.length,
          timestamp: Date.now(),
        }));

        const videoScreenKey = normalizeScreen(data.screen || data.screenId || '');

        // ── Per-screen FIFO queue ──────────────────────────────────────
        if (!videoQueueByScreen[videoScreenKey]) {
          videoQueueByScreen[videoScreenKey] = [];
          // Initialize max queue length for this screen if not set
          if (maxVideoQueueLengthByScreen[videoScreenKey] === undefined) {
            maxVideoQueueLengthByScreen[videoScreenKey] = DEFAULT_MAX_QUEUE_LENGTH;
          }
        }

        // Get max queue length for this screen
        const maxQueueForScreen = maxVideoQueueLengthByScreen[videoScreenKey] ?? DEFAULT_MAX_QUEUE_LENGTH;

        // Check queue capacity (per-screen limit)
        if (videoQueueByScreen[videoScreenKey].length >= maxQueueForScreen) {
          console.warn('[VIDEO-QUEUE]', {
            phase: 'reject-full',
            instanceId: overlayInstanceId,
            screenKey: videoScreenKey,
            actionName: data.actionName,
            queueLength: videoQueueByScreen[videoScreenKey].length,
            maxLength: maxQueueForScreen,
            timestamp: Date.now(),
          });
          return;
        }

        // Deduplication: skip if same actionExecutionId already in queue
        if (data.actionExecutionId) {
          const alreadyQueued = videoQueueByScreen[videoScreenKey].some(
            q => q.actionExecutionId === data.actionExecutionId
          );
          if (alreadyQueued) {
            console.log('[OVERLAY-WIDGET-VIDEO-QUEUE] duplicate actionExecutionId ignored', JSON.stringify({
              screen: videoScreenKey,
              actionExecutionId: data.actionExecutionId,
              timestamp: Date.now(),
            }));
            return;
          }
        }

        // Enqueue this video
        const queueEntry = {
          data,
          actionExecutionId: data.actionExecutionId,
          started: false,
          completed: false,
          removalState: { removed: false },
          overlay: null,
          vid: null,
          removalState: { removed: false },
        };
        videoQueueByScreen[videoScreenKey].push(queueEntry);

        console.log('[TIMING-TRACE]', JSON.stringify({
          stage: 'overlay-widget-video-enqueue',
          actionExecutionId: data.actionExecutionId,
          actionId: data.actionId,
          actionName: data.actionName,
          screen: videoScreenKey,
          queueLength: videoQueueByScreen[videoScreenKey].length,
          maxQueueForScreen,
          activeVideoExists: !!activeVideoByScreen[videoScreenKey],
          timestamp: Date.now(),
        }));

        // If no video currently playing, start this one immediately
        if (!activeVideoByScreen[videoScreenKey]) {
          console.log('[TIMING-TRACE]', JSON.stringify({
            stage: 'overlay-widget-playNextInQueue-call',
            actionExecutionId: data.actionExecutionId,
            screen: videoScreenKey,
            timestamp: Date.now(),
          }));
          playNextInQueue(videoScreenKey);
        } else {
          console.log('[TIMING-TRACE]', JSON.stringify({
            stage: 'overlay-widget-queued-behind-active',
            actionExecutionId: data.actionExecutionId,
            screen: videoScreenKey,
            queuePosition: videoQueueByScreen[videoScreenKey].length,
            activeActionExecutionId: activeVideoByScreen[videoScreenKey]?.actionExecutionId,
            timestamp: Date.now(),
          }));
        }
        return; // Video is now handled exclusively by the queue
      }

// ── IMAGE (fullscreen) ──
      if (data.type === "image" && data.imageFile) {
        console.log('[OVERLAY-WIDGET-RENDER] START', JSON.stringify({
          type: 'image',
          actionName: data.actionName,
          screen: data.screen,
          imageFile: data.imageFile.substring(0, 100),
          imageFileLength: data.imageFile.length,
          timestamp: Date.now(),
        }));

        const overlay = document.createElement("div");
        overlay.className = "media-overlay";
        const img = document.createElement("img");
        img.src = data.imageFile;

        console.log('[OVERLAY-WIDGET-RENDER] IMAGE', JSON.stringify({
          actionName: data.actionName,
          imageSrc: img.src ? img.src.substring(0, 100) : null,
          imageSrcLength: img.src ? img.src.length : 0,
          timestamp: Date.now(),
        }));

        img.onload = () => {
          console.log('[OVERLAY-WIDGET-RENDER] IMAGE loaded', JSON.stringify({
            actionName: data.actionName,
            naturalWidth: img.naturalWidth,
            naturalHeight: img.naturalHeight,
            timestamp: Date.now(),
          }));
          console.log('[OVERLAY-WIDGET-RENDER] COMPLETE', JSON.stringify({
            type: 'image',
            actionName: data.actionName,
            timestamp: Date.now(),
          }));
          updateDiag('diag-last-render', 'SUCCESS', 'success');
          // Completion is dispatched by remove() below — NOT here
        };

        overlay.appendChild(img);
        document.body.appendChild(overlay);

        const imageStartMs = Date.now();
        const imageDurationMs = (data.duration || 5) * 1000;
        console.log('[ACTION-EFFECT-START]', JSON.stringify({
          actionId: data.actionId,
          effectType: 'image',
          duration: data.duration || 5,
          actionExecutionId: data.actionExecutionId,
        }));
        console.log('[ACTION-DURATION-TIMER]', JSON.stringify({
          actionId: data.actionId,
          effectType: 'image',
          durationMs: imageDurationMs,
          actionExecutionId: data.actionExecutionId,
        }));

        let imageRemoved = false;
        const remove = () => {
          if (imageRemoved) return;
          imageRemoved = true;
          // Log element CSS/layout info before removal
          const rect = overlay.getBoundingClientRect();
          const style = window.getComputedStyle(overlay);
          console.log('[OVERLAY-WIDGET-RENDER] IMAGE removing overlay', JSON.stringify({
            actionName: data.actionName,
            elementExists: !!overlay.parentElement,
            display: style.display,
            visibility: style.visibility,
            opacity: style.opacity,
            width: style.width,
            height: style.height,
            position: style.position,
            zIndex: style.zIndex,
            boundingRect: { top: rect.top, left: rect.left, width: rect.width, height: rect.height },
            imageNaturalWidth: img.naturalWidth,
            imageNaturalHeight: img.naturalHeight,
            imageComplete: img.complete,
            timestamp: Date.now(),
          }));
          console.log('[ACTION-EFFECT-END]', JSON.stringify({
            actionId: data.actionId,
            effectType: 'image',
            elapsedMs: Date.now() - imageStartMs,
            expectedDurationMs: imageDurationMs,
            actionExecutionId: data.actionExecutionId,
          }));
          // Relay completion across Browser Source → Electron renderer context.
          if (data.actionExecutionId) {
            const completion = {
              type: 'media-complete',
              mediaType: 'image',
              screen: data.screen,
              actionExecutionId: data.actionExecutionId,
              actionId: data.actionId,
              actionName: data.actionName,
              timestamp: Date.now(),
            };
            fetch('http://127.0.0.1:18890/event', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(completion),
            }).then((response) => {
              console.log('[MEDIA-COMPLETE-RELAY][HTTP]', JSON.stringify({
                actionExecutionId: data.actionExecutionId,
                screen: data.screen,
                mediaType: 'image',
                status: response.status,
                ok: response.ok,
                timestamp: Date.now(),
              }));
            }).catch((error) => {
              console.error('[MEDIA-COMPLETE-RELAY][HTTP-ERROR]', JSON.stringify({
                actionExecutionId: data.actionExecutionId,
                screen: data.screen,
                mediaType: 'image',
                error: error instanceof Error ? error.message : String(error),
                timestamp: Date.now(),
              }));
            });

            // Dispatch completion event BEFORE removing DOM
            console.log('[OVERLAY-WIDGET-COMPLETION] image complete', JSON.stringify({
              actionExecutionId: data.actionExecutionId,
              actionId: data.actionId,
              actionName: data.actionName,
              screen: data.screen,
              mediaType: 'image',
              timestamp: Date.now(),
            }));
            window.dispatchEvent(new CustomEvent('rosae:media-complete', {
              detail: {
                type: 'media-complete',
                mediaType: 'image',
                screen: data.screen,
                actionExecutionId: data.actionExecutionId,
                actionId: data.actionId,
                actionName: data.actionName,
                timestamp: Date.now(),
              }
            }));
          }
          if (overlay.parentElement) overlay.remove();
        };

        img.onerror = () => {
          console.error('[OVERLAY-WIDGET-RENDER] IMAGE ERROR', JSON.stringify({
            actionName: data.actionName,
            error: 'Failed to load image',
            timestamp: Date.now(),
          }));
          console.log('[OVERLAY-WIDGET-RENDER] ERROR', JSON.stringify({
            type: 'image',
            actionName: data.actionName,
            error: 'Failed to load image',
            timestamp: Date.now(),
          }));
          updateDiag('diag-last-render', 'ERROR', 'error');
          remove();
        };

        setTimeout(remove, imageDurationMs);
        return;
      }

      // ── KEYSTROKE ──
      if (data.type === "keystroke" && data.keystrokeKeys) {
        // Visual card lifetime = keystrokeDuration (fallback Action duration).
        // NOT holdMs — holdMs is native key hold on the SendInput path.
        const keystrokeVisualSeconds = data.keystrokeDuration || data.duration || 5;
        const keystrokeVisualMs = keystrokeVisualSeconds * 1000;
        const keystrokeStartMs = Date.now();
        console.log('[ACTION-EFFECT-START]', JSON.stringify({
          actionId: data.actionId,
          effectType: 'keystroke',
          duration: keystrokeVisualSeconds,
          holdMs: data.keystrokeHoldMs || 100,
          actionExecutionId: data.actionExecutionId,
        }));
        console.log('[ACTION-DURATION-TIMER]', JSON.stringify({
          actionId: data.actionId,
          effectType: 'keystroke',
          durationMs: keystrokeVisualMs,
          actionExecutionId: data.actionExecutionId,
        }));
        const card = document.createElement("div");
        card.className = "alert-card alert-action";
        card.style.setProperty("--out-delay", Math.max(0, (keystrokeVisualMs - 400) / 1000) + "s");
        card.innerHTML = `
          <div class="alert-icon">${ICONS.keystroke || "⌨️"}</div>
          <div class="alert-body">
            <div class="alert-title">Keystroke</div>
            <div class="alert-user">@${data.user || data.nickname || "test"}</div>
            <div class="alert-detail"><code style="font-family: monospace; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px;">${data.keystrokeKeys}</code></div>
            <div class="alert-detail">Hold: ${data.keystrokeHoldMs || 100}ms</div>
          </div>
        `;
        container.prepend(card);
        setTimeout(() => {
          console.log('[ACTION-EFFECT-END]', JSON.stringify({
            actionId: data.actionId,
            effectType: 'keystroke',
            elapsedMs: Date.now() - keystrokeStartMs,
            expectedDurationMs: keystrokeVisualMs,
            actionExecutionId: data.actionExecutionId,
          }));
          if (card.parentElement) card.remove();
        }, keystrokeVisualMs);
        while (container.children.length > 5) container.lastElementChild.remove();
        return;
      }

      // ── ALERT CARD ──
      const card = document.createElement("div");
      const eventType = data.eventType || data.type || "action";
      card.className = `alert-card alert-${["gift","follow","like","share","subscribe","comment"].includes(eventType) ? eventType : "action"}`;
      card.style.setProperty("--out-delay", "4.5s");

      let detail = "";
      let badge = "";
      if (eventType === "gift") { detail = data.giftName || "Gift"; badge = `×${data.repeatCount || 1}`; }
      else if (eventType === "comment") { detail = data.comment || ""; }
      else if (eventType === "like") { badge = `+${data.likeCount || 1} ❤️`; }

      card.innerHTML = `
        <div class="alert-icon">${ICONS[eventType] || "⚡"}</div>
        <div class="alert-body">
          <div class="alert-title">${eventType}</div>
          <div class="alert-user">@${data.user || data.nickname || "someone"}</div>
          ${detail ? `<div class="alert-detail">${detail}</div>` : ""}
        </div>
        ${badge ? `<div class="alert-badge">${badge}</div>` : ""}
      `;
      container.prepend(card);
      setTimeout(() => { if (card.parentElement) card.remove(); }, 5000);
      while (container.children.length > 5) container.lastElementChild.remove();
    }

    // ═══ VIDEO PRELOAD (set by action-queue.ts) ═══
    // action-queue dispatches this event after sending a video to the overlay,
    // providing a peek at the next queued item so preload can start immediately.
    window.__rf_peekNextQueued = null; // replaced by action-queue
    window.addEventListener('rosae:preload-video', (e) => {
      if (e.detail?.type === 'preload-next') {
        // Store peek function for preloadNextVideo to call
        window.__rf_peekNextQueued = () => e.detail.nextEvent;
        // Trigger preload immediately
        preloadNextVideo();
      }
    });

    // ═══ EVENT SOURCES ═══

    // SSE
    function connectSSE() {
      try {
        // Use screen parameter from URL for SSE connection
        const sseUrl = `http://127.0.0.1:18890/events?screen=${encodeURIComponent(screen || '')}`;
        console.log('[OVERLAY-SSE-CLIENT] EventSource URL', JSON.stringify({
          url: sseUrl,
          windowLocation: window.location.href,
          screen: screen,
          timestamp: Date.now(),
        }));
        console.log('[OVERLAY-SSE-CLIENT] connecting', JSON.stringify({
          sseUrl,
          readyState: 0, // CONNECTING
          timestamp: Date.now(),
        }));
        const es = new EventSource(sseUrl);
        es.onopen = () => {
          statusDot.classList.add("connected");
          statusDot.title = "Connected";
          updateDiag('diag-sse', 'CONNECTED', 'connected');
          console.log('[OVERLAY-SSE-CLIENT] open', JSON.stringify({
            url: sseUrl,
            readyState: es.readyState,
            timestamp: Date.now(),
          }));
        };
        es.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            console.log('[OVERLAY-SSE-CLIENT] message', JSON.stringify({
              readyState: es.readyState,
              type: data.type,
              actionName: data.actionName,
              screen: data.screen,
              videoFile: data.videoFile ? data.videoFile.substring(0, 100) : null,
              imageFile: data.imageFile ? data.imageFile.substring(0, 100) : null,
              timestamp: Date.now(),
            }));
            // Extract screen from either 'screen' or 'screenId' field
            const eventScreen = data.screen || data.screenId;
            const normalizedEventScreen = normalizeScreen(eventScreen);
            // Screen filter: reject if widget has a screen and event doesn't match
            if (screen) {
              if (!normalizedEventScreen || normalizedEventScreen !== normalizedWidgetScreen) {
                return;
              }
            }
            updateDiag('diag-last-event', data.type || data.actionName || 'unknown');
            showAlert(data);
          } catch (err) {
            console.error('[OVERLAY-SSE-CLIENT] parse error', err);
          }
        };
        es.onerror = (err) => {
          statusDot.classList.remove("connected");
          updateDiag('diag-sse', 'DISCONNECTED', 'disconnected');
          console.error('[OVERLAY-SSE-CLIENT] error', JSON.stringify({
            url: sseUrl,
            readyState: es.readyState,
            error: err ? String(err) : 'EventSource error',
            timestamp: Date.now(),
          }));
          // Log reconnect attempt
          console.log('[OVERLAY-SSE-CLIENT] reconnecting in 3s...', JSON.stringify({
            url: sseUrl,
            timestamp: Date.now(),
          }));
          es.close();
          setTimeout(connectSSE, 3000);
        };
      } catch (_) { setTimeout(connectSSE, 3000); }
    }
    connectSSE();

    // BroadcastChannel
    try {
      new BroadcastChannel("rosaefinity-overlay").onmessage = (e) => {
        if (e.data) {
          console.log('[OVERLAY-BROADCAST-CLIENT] message', JSON.stringify({
            type: e.data.type,
            actionName: e.data.actionName,
            screen: e.data.screen,
            timestamp: Date.now(),
          }));
          // Extract screen from either 'screen' or 'screenId' field
          const eventScreen = e.data.screen || e.data.screenId;
          const normalizedEventScreen = normalizeScreen(eventScreen);
          // Screen filter: reject if widget has a screen and event doesn't match
          if (screen) {
            if (!normalizedEventScreen || normalizedEventScreen !== normalizedWidgetScreen) {
              return;
            }
          }
          updateDiag('diag-last-event', e.data.type || e.data.actionName || 'unknown');
          showAlert(e.data);
        }
      };
    } catch {}

    // localStorage polling
    let lastChecked = 0;
    setInterval(() => {
      try {
        const t = localStorage.getItem("rf_overlay_test_time");
        if (t && parseInt(t) > lastChecked) {
          lastChecked = parseInt(t);
          const d = localStorage.getItem("rf_overlay_test");
          if (d) {
            try {
              const data = JSON.parse(d);
              console.log('[OVERLAY-LOCALSTORAGE-CLIENT] message', JSON.stringify({
                type: data.type,
                actionName: data.actionName,
                screen: data.screen,
                timestamp: Date.now(),
              }));
              // Extract screen from either 'screen' or 'screenId' field
              const eventScreen = data.screen || data.screenId;
              const normalizedEventScreen = normalizeScreen(eventScreen);
              // Screen filter: reject if widget has a screen and event doesn't match
              if (screen) {
                if (!normalizedEventScreen || normalizedEventScreen !== normalizedWidgetScreen) {
                  return;
                }
              }
              updateDiag('diag-last-event', data.type || data.actionName || 'unknown');
              showAlert(data);
            } catch {}
          }
        }
      } catch {}
    }, 500);

    // CustomEvent
    window.addEventListener("rosae:overlay-event", (e) => {
      if (e.detail) {
        console.log('[OVERLAY-CUSTOMEVENT-CLIENT] message', JSON.stringify({
          type: e.detail.type,
          actionName: e.detail.actionName,
          screen: e.detail.screen,
          timestamp: Date.now(),
        }));
        // Extract screen from either 'screen' or 'screenId' field
        const eventScreen = e.detail.screen || e.detail.screenId;
        const normalizedEventScreen = normalizeScreen(eventScreen);
        // Screen filter: reject if widget has a screen and event doesn't match
        if (screen) {
          if (!normalizedEventScreen || normalizedEventScreen !== normalizedWidgetScreen) {
            return;
          }
        }
        updateDiag('diag-last-event', e.detail.type || e.detail.actionName || 'unknown');
        showAlert(e.detail);
      }
    });

    console.log("[Overlay] Ready");
  </script>
</body>
</html>
