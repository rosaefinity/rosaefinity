services:
  - type: web
    name: rosaefinity-api
    runtime: node
    plan: starter  # Paid tier required for SSE long-lived connections
    region: oregon
    rootDir: server
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run start
    preDeployCommand: npx prisma migrate deploy
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rosaefinity-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: CORS_ORIGINS
        sync: false  # Set manually after deployment
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: LOG_LEVEL
        value: info

databases:
  - name: rosaefinity-db
    plan: starter  # Paid PostgreSQL
    databaseName: rosaefinity
    ipAllowList: []  # Only accessible from Render services
